        let cart = [];

        function renderGames() {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = games.map(game => `
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition overflow-hidden flex flex-col justify-between">
                    <div>
                        <div class="h-48 overflow-hidden bg-gray-100">
                            <img src="${game.image}" alt="${game.name}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-gray-800 text-sm line-clamp-2">${game.name}</h3>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <button onclick="addToCart(${game.id})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center space-x-1 space-x-reverse">
                            <i class="fa-solid fa-plus"></i>
                            <span>إضافة للسلة</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(gameId) {
            const game = games.find(g => g.id === gameId);
            const existingItem = cart.find(item => item.id === gameId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...game, quantity: 1 });
            }

            updateCartUI();
            toggleCart();
        }

        function updateCartUI() {
            const countElem = document.getElementById('cart-count');
            const itemsElem = document.getElementById('cart-items');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            countElem.innerText = totalCount;

            if (cart.length === 0) {
                itemsElem.innerHTML = `<p class="text-gray-400 text-center py-10">السلة فارغة حالياً</p>`;
                return;
            }

            itemsElem.innerHTML = cart.map(item => `
                <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-100">
                    <div class="flex items-center space-x-3 space-x-reverse">
                        <img src="${item.image}" class="w-12 h-12 object-cover rounded-lg">
                        <div>
                            <h4 class="font-bold text-sm text-gray-800">${item.name}</h4>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 space-x-reverse">
                        <button onclick="change
