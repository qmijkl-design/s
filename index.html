<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر ألعاب PS4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- الهيدر -->
    <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2 space-x-reverse">
                <div class="bg-blue-600 text-white p-2 rounded-xl shadow-md">
                    <i class="fa-solid fa-gamepad text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-900">متجر ألعاب PS4</h1>
                    <p class="text-xs text-gray-500">اختر ألعابك واطلبها مباشرة</p>
                </div>
            </div>
            
            <button onclick="toggleCart()" class="relative bg-gray-100 hover:bg-gray-200 text-gray-800 px-4 py-2.5 rounded-xl font-medium transition flex items-center space-x-2 space-x-reverse">
                <i class="fa-solid fa-cart-shopping text-blue-600"></i>
                <span>السلة</span>
                <span id="cart-count" class="bg-blue-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
            </button>
        </div>
    </header>

    <!-- قائمة الألعاب -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="mb-6">
            <h2 class="text-xl font-bold text-gray-800">قائمة الألعاب المتوفرة</h2>
            <p class="text-sm text-gray-500">اضغط على "إضافة للسلة" لأي لعبة تريد طلبها</p>
        </div>

        <div id="games-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            <!-- يتم تحميل الألعاب هنا -->
        </div>
    </main>

    <!-- نافذة السلة -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end transition-opacity">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col p-6 overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-blue-600"></i> سلة الطلبات
                </h3>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>

            <div id="cart-items" class="flex-grow space-y-4 overflow-y-auto py-2">
                <p class="text-gray-400 text-center py-10">السلة فارغة حالياً</p>
            </div>

            <div class="border-t pt-4 mt-4 space-y-4">
                <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 space-x-reverse text-base">
                    <i class="fa-brands fa-whatsapp text-2xl"></i>
                    <span>إرسال الطلب عبر الواتساب</span>
                </button>
            </div>
        </div>
    </div>

    <footer class="bg-white border-t border-gray-100 py-4 text-center text-xs text-gray-400">
        جميع الحقوق محفوظة © متجر ألعاب PS4
    </footer>
