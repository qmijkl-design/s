<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر أبو يونس للألعاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

    <!-- رأس التطبيق الواضح جداً -->
    <header class="bg-gray-900 border-b border-blue-600/30 sticky top-0 z-40 shadow-xl">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-blue-600 text-white p-3 rounded-2xl shadow-lg shadow-blue-600/30">
                    <i class="fa-solid fa-gamepad text-2xl"></i>
                </div>
                <div>
                    <!-- اسم المتجر بشكل كبير وواضح -->
                    <h1 class="text-2xl md:text-3xl font-black text-white tracking-wide">
                        متجر <span class="text-blue-500">أبو يونس</span> للألعاب
                    </h1>
                    <p class="text-xs text-gray-400">قسم ألعاب بلايستيشن 4 (PS4)</p>
                </div>
            </div>
            
            <!-- زر السلة -->
            <button onclick="toggleCart()" class="relative bg-gray-800 hover:bg-gray-700 text-white px-5 py-2.5 rounded-xl font-bold transition flex items-center space-x-2 space-x-reverse border border-gray-700 cursor-pointer">
                <i class="fa-solid fa-cart-shopping text-blue-400 text-lg"></i>
                <span>السلة</span>
                <span id="cart-count" class="bg-blue-600 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-extrabold shadow-md">0</span>
            </button>
        </div>
    </header>

    <!-- شريط ترحيبي بارز باسم أبو يونس -->
    <section class="bg-gradient-to-r from-blue-900/40 via-gray-900 to-blue-900/40 border-b border-gray-800 py-6 text-center">
        <div class="max-w-4xl mx-auto px-4">
            <h2 class="text-xl md:text-2xl font-bold text-white mb-1">أهلاً بكم في متجر أبو يونس</h2>
            <p class="text-sm text-gray-300">اختر ألعابك المفضلة لبلايستيشن 4 واطلبها مباشرة عبر الواتساب بنقرة واحدة</p>
        </div>
    </section>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- شبكة عرض الألعاب -->
        <div id="games-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- نافذة السلة الجانبية -->
    <div id="cart-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex justify-end backdrop-blur-sm">
        <div class="bg-gray-900 w-full max-w-md h-full shadow-2xl flex flex-col p-6 overflow-y-auto border-r border-gray-800">
            <div class="flex justify-between items-center border-b border-gray-800 pb-4 mb-4">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-blue-500"></i>
                    سلة طلبات متجر أبو يونس
                </h3>
                <button onclick="toggleCart()" class="text-2xl text-gray-400 hover:text-white cursor-pointer">&times;</button>
            </div>
            <div id="cart-items" class="flex-grow space-y-3"></div>
            <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl mt-4 transition cursor-pointer shadow-lg shadow-emerald-600/20 flex items-center justify-center space-x-2 space-x-reverse">
                <i class="fa-brands fa-whatsapp text-2xl"></i>
                <span>إرسال الطلب إلى أبو يونس عبر الواتساب</span>
            </button>
        </div>
    </div>

    <!-- تذييل الصفحة -->
    <footer class="bg-gray-900 border-t border-gray-800 text-center py-4 text-sm text-gray-400">
        جميع الحقوق محفوظة &copy; <strong>متجر أبو يونس للألعاب</strong> 2026
    </footer>

    <script>
        // قائمة ألعاب PS4 بالصور المطلوبة
