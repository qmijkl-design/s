<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر ألعاب PS4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2 space-x-reverse">
                <div class="bg-blue-600 text-white p-2 rounded-xl shadow-md"><i class="fa-solid fa-gamepad text-xl"></i></div>
                <div>
                    <h1 class="text-lg font-bold text-gray-900">متجر ألعاب PS4</h1>
                </div>
            </div>
            <button onclick="toggleCart()" class="relative bg-gray-100 hover:bg-gray-200 text-gray-800 px-4 py-2.5 rounded-xl font-medium transition flex items-center space-x-2 space-x-reverse cursor-pointer">
                <i class="fa-solid fa-cart-shopping text-blue-600"></i>
                <span>السلة</span>
                <span id="cart-count" class="bg-blue-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="games-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- نافذة السلة -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col p-6 overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h3 class="text-lg font-bold">سلة الطلبات</h3>
                <button onclick="toggleCart()" class="text-xl cursor-pointer">&times;</button>
            </div>
            <div id="cart-items" class="flex-grow space-y-4"></div>
            <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl mt-4 transition cursor-pointer">إرسال الطلب عبر الواتساب</button>
        </div>
    </div>

    <script>
        const games = [
            { id: 1, name: "Marvel's Avengers (Update 1.12)", image: "63019.jpg" },
            { id: 2, name: "Little Nightmares II", image: "63020.jpg" },
            { id: 3, name: "Mafia III", image: "63021.jpg" },
            { id: 4, name: "Mafia: Definitive Edition", image: "63022.jpg" },
            { id: 5, name: "Marvel's Guardians of the Galaxy", image: "63023.jpg" },
            { id: 6, name: "Mass Effect Legendary Edition", image: "63024.jpg" },
            { id: 7, name: "Mafia II", image: "63025.jpg" },
            { id: 8, name: "Metal Gear Solid V", image: "63026.jpg" },
            { id: 9, name: "Metal Slug 3", image: "63027.jpg" },
            { id: 10, name: "Metro Exodus", image: "63028.jpg" },
            { id: 11, name: "The Dark Pictures: House of Ashes", image: "63029.jpg" },
            { id: 12, name: "The Last of Us Part II", image: "63030.jpg" },
            { id: 13, name: "The Evil Within 2", image: "63031.jpg" },
            { id: 14, name: "Tom and Jerry", image: "63032.jpg" },
            { id: 15, name: "The Last of Us", image: "63033.jpg" },
            { id: 16, name: "The Witcher 3: Wild Hunt", image: "63034.jpg" },
            { id: 17, name: "TMNT: Mutants Unleashed", image: "63035.jpg" },
            { id: 18, name: "The Callisto Protocol", image: "63036.jpg" },
            { id: 19, name: "The Order: 1886", image: "63037.jpg" },
            { id: 20, name: "The Last Guardian", image: "63038.jpg" },
            { id: 21, name: "Tomb Raider: Definitive Edition", image: "63039.jpg" },
            { id: 22, name: "Rise of the Tomb Raider", image: "63040.jpg" },
            { id: 23, name: "Uncharted 4: A Thief's End", image: "63041.jpg" },
            { id: 24, name: "Shadow of the Tomb Raider", image: "63042.jpg" },
            { id: 25, name: "Uncharted 3", image: "63043.jpg" },
            { id: 26, name: "Uncharted: The Lost Legacy", image: "63044.jpg" },
            { id: 27, name: "Watch Dogs 2", image: "63045.jpg" },
            { id: 28, name: "Twisted Metal 2", image: "63046.jpg" },
            { id: 29, name: "Watch Dogs: Legion", image: "63047.jpg" },
            { id: 30, name: "Unknown 9: Awakening", image: "63048.jpg" },
            { id: 31, name: "Sinner: Sacrifice for Redemption", image: "63049.jpg" },
            { id: 32, name: "Sleeping Dogs", image: "63050.jpg" },
            { id: 33, name: "Sniper Ghost Warrior 3", image: "63051.jpg" },
            { id: 34, name: "Sniper Elite V2", image: "63052.jpg" },
            { id: 35, name: "Sniper Elite 4", image: "63053.jpg" },
            { id: 36, name: "Sniper Elite 5", image: "63054.jpg" },
            { id: 37, name: "Sniper Ghost Warrior Contracts", image: "63055.jpg" },
            { id: 38, name: "SnowRunner", image: "63056.jpg" },
            { id: 39, name: "Sniper Elite 3: Afrika", image: "63057.jpg" },
            { id: 40, name: "Sniper Elite: Resistance", image: "63058.jpg" },
            { id: 41, name: "Sonic Superstars", image: "63059.jpg" },
            { id: 42, name: "Sonic Forces", image: "63060.jpg" },
            { id: 43, name: "Spider-Man (Black Suit)", image: "63061.jpg" },
            { id: 44, name: "Spider-Man (Classic)", image: "63062.jpg" },
            { id: 45, name: "Stray", image: "63063.jpg" },
            { id: 46, name: "Spyro Reignited Trilogy", image: "63064.jpg" },
            { id: 47, name: "Star Words Battlefront II", image: "63065.jpg" },
            { id: 48, name: "SpongeBob SquarePants", image: "63066.jpg" },
            { id: 49, name: "Tekken 7", image: "63067.jpg" }
        ];

        let cart = [];

        function renderGames() {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = games.map(game => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 transition hover:shadow-md flex flex-col justify-between">
                    <div>
                        <div class="w-full h-48 bg-gray-100 rounded-lg mb-3 overflow-hidden flex items-center justify-center">
                            <img src="${game.image}" alt="${game.name}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x400?text=PS4+Game';">
                        </div>
                        <h3 class="font-bold text-sm mb-3 text-gray-800 line-clamp-2">${game.name}</h3>
                    </div>
                    <button onclick="addToCart(${game.id})" class="w-full bg-blue-50 text-blue-600 py-2 rounded-lg font-bold hover:bg-blue-600 hover:text-white transition cursor-pointer">إضافة للسلة</button>
                </div>
            `).join('');
        }

        function toggleCart() { 
            document.getElementById('cart-modal').classList.toggle('hidden'); 
        }

        function addToCart(id) {
            const game = games.find(g => g.id === id);
            cart.push(game);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const items = document.getElementById('cart-items');
            items.innerHTML = cart.length > 0 ? cart.map((g, i) => `
                <div class="flex justify-between items-center border-b pb-2">
                    <span class="text-sm font-medium text-gray-700">${g.name}</span>
                    <button onclick="removeFromCart(${i})" class="text-red-500 hover:text-red-700 text-xs cursor-pointer">حذف</button>
                </div>
            `).join('') : '<p class="text-gray-400 text-center py-10">السلة فارغة حالياً</p>';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function sendToWhatsApp() {
            if(cart.length === 0) return alert('السلة فارغة!');
            const phone = "9647726541533"; 
            const message = "مرحباً، أود طلب الألعاب التالية:\n" + cart.map((g, index) => `${index + 1}. ${g.name}`).join('\n');
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        renderGames();
    </script>
</body>
</html>
