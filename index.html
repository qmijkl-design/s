<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر أبو يونس للألعاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

    <!-- شريط الرأس الرئيسي -->
    <header class="bg-gray-900 border-b-2 border-blue-600 sticky top-0 z-40 shadow-2xl">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-blue-600 text-white p-3 rounded-2xl shadow-lg shadow-blue-600/40">
                    <i class="fa-solid fa-gamepad text-3xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-black text-white tracking-wider">
                        متجر <span class="text-blue-500">أبو يونس</span> للألعاب
                    </h1>
                    <p class="text-xs text-blue-300 font-semibold mt-0.5">قسم ألعاب بلايستيشن 4 (PS4)</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3 space-x-reverse">
                <button onclick="toggleAdminPanel()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl font-bold transition flex items-center space-x-2 space-x-reverse text-sm cursor-pointer shadow-md">
                    <i class="fa-solid fa-plus-circle"></i>
                    <span>إدارة الألعاب والحفظ</span>
                </button>

                <button onclick="toggleCart()" class="relative bg-blue-600/20 hover:bg-blue-600/30 text-white px-4 py-2.5 rounded-xl font-bold transition flex items-center space-x-2 space-x-reverse border border-blue-500/40 cursor-pointer">
                    <i class="fa-solid fa-cart-shopping text-blue-400 text-lg"></i>
                    <span class="text-sm">السلة</span>
                    <span id="cart-count" class="bg-blue-600 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-extrabold shadow-md">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- لوحة التحكم -->
    <div id="admin-panel" class="hidden bg-gray-900 border-b border-emerald-600/50 py-6 px-4">
        <div class="max-w-2xl mx-auto bg-gray-950 p-6 rounded-2xl border border-gray-800 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h3 class="text-lg font-bold text-emerald-400 flex items-center gap-2">
                    <i class="fa-solid fa-database"></i> إدارة وحفظ ألعاب أبو يونس
                </h3>
                <button onclick="toggleAdminPanel()" class="text-gray-400 hover:text-white text-2xl cursor-pointer">&times;</button>
            </div>

            <!-- رفع صور جديدة -->
            <div class="p-4 bg-gray-900 rounded-xl border border-gray-800">
                <label class="block text-sm font-bold text-gray-200 mb-2">📁 رفع صور جديدة دفعة واحدة:</label>
                <input type="file" id="batch-file-input" multiple accept="image/*" class="block w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer mb-3">
                <button onclick="uploadBatchFast()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition cursor-pointer text-xs">
                    إضافة الصور المحددة للمتجر
                </button>
            </div>

            <!-- استيراد ملف الحفظ السابق -->
            <div class="p-4 bg-gray-900 rounded-xl border border-gray-800">
                <label class="block text-sm font-bold text-gray-200 mb-2">📥 استيراد ملف الحفظ (استرجاع ألعابك المحفوظة):</label>
                <input type="file" id="import-file-input" accept=".json" onchange="importGameData(event)" class="block w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
            </div>

            <!-- زر تصدير الحفظ -->
            <button onclick="exportCode()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition cursor-pointer text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-file-arrow-down"></i> تصدير وحفظ الألعاب (تحميل ملف البيانات)
            </button>
        </div>
    </div>

    <!-- شريط البحث والترحيب -->
    <section class="bg-gradient-to-r from-blue-900/40 via-gray-900 to-blue-900/40 border-b border-gray-800 py-6">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <p class="text-base md:text-lg font-bold text-gray-200 mb-4">
                🎮 أهلاً بكم في <span class="text-blue-400 font-black">متجر أبو يونس</span> - تصفح واطلب ألعابك مباشرة عبر الواتساب 🎮
            </p>
            <div class="relative max-w-xl mx-auto">
                <input type="text" id="search-input" oninput="filterGames()" placeholder="ابحث عن اسم اللعبة هنا..." class="w-full bg-gray-900 text-white border border-gray-700 rounded-xl py-3 px-11 text-sm focus:outline-none focus:border-blue-500 transition shadow-inner">
                <i class="fa-solid fa-magnifying-glass absolute right-4 top-3.5 text-gray-400"></i>
            </div>
        </div>
    </section>

    <!-- عرض الألعاب -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="games-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
        <div id="no-results" class="hidden text-center py-16 text-gray-400">
            <i class="fa-solid fa-circle-exclamation text-4xl mb-2 text-gray-600"></i>
            <p class="text-lg">لا توجد ألعاب حالياً، قم برفع الصور من خيار الإدارة بالأعلى</p>
        </div>
    </main>

    <!-- نافذة السلة الجانبية -->
    <div id="cart-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex justify-end backdrop-blur-sm">
        <div class="bg-gray-900 w-full max-w-md h-full shadow-2xl flex flex-col p-6 overflow-y-auto border-r border-gray-800">
            <div class="flex justify-between items-center border-b border-gray-800 pb-4 mb-4">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-blue-500"></i>
                    سلة طلبات متجر أبو يونس
                </h3>
                <button onclick="toggleCart()" class="text-3xl text-gray-400 hover:text-white cursor-pointer">&times;</button>
            </div>
            <div id="cart-items" class="flex-grow space-y-3"></div>
            <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl mt-4 transition cursor-pointer shadow-lg shadow-emerald-600/20 flex items-center justify-center space-x-2 space-x-reverse text-base">
                <i class="fa-brands fa-whatsapp text-2xl"></i>
                <span>إرسال الطلب لـ أبو يونس عبر الواتساب</span>
            </button>
        </div>
    </div>

    <footer class="bg-gray-900 border-t border-gray-800 text-center py-4 text-sm text-gray-400">
        جميع الحقوق محفوظة &copy; <strong class="text-white">متجر أبو يونس للألعاب</strong>
    </footer>

    <script>
        let games = JSON.parse(localStorage.getItem('abu_younis_saved_games')) || [];
        let cart = [];

        function toggleAdminPanel() {
            document.getElementById('admin-panel').classList.toggle('hidden');
        }

        function uploadBatchFast() {
            const input = document.getElementById('batch-file-input');
            const files = input.files;
            
            if (files.length === 0) return alert('الرجاء اختيار الصور أولاً!');

            Array.from(files).forEach((file, idx) => {
                const imageUrl = URL.createObjectURL(file);
                const gameName = file.name.replace(/\.[^/.]+$/, ""); 

                games.unshift({
                    id: Date.now() + idx,
                    name: gameName,
                    image: imageUrl
                });
            });

            saveAndRender();
            input.value = '';
            toggleAdminPanel();
            alert('تمت إضافة الصور وحفظها بنجاح!');
        }

        function importGameData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedGames = JSON.parse(e.target.result);
                    if (Array.isArray(importedGames)) {
                        games = importedGames;
                        saveAndRender();
                        alert('تم استيراد الألعاب بنجاح إلى المتجر!');
                        toggleAdminPanel();
                    } else {
                        alert('ملف غير صالح!');
                    }
                } catch (err) {
                    alert('خطأ في قراءة الملف!');
                }
            };
            reader.readAsText(file);
        }

        function deleteGame(id) {
            games = games.filter(g => g.id !== id);
            cart = cart.filter(c => c.id !== id);
            saveAndRender();
            updateCartUI();
        }

        function saveAndRender() {
            localStorage.setItem('abu_younis_saved_games', JSON.stringify(games));
            renderGames();
        }

        function exportCode() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(games));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "abu_younis_games.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            alert('تم تحميل ملف الحفظ بنجاح! يمكنك إرساله لي لاحقاً لدمجه مباشرة داخل الكود.');
        }

        function renderGames(data = games) {
            const grid = document.getElementById('games-grid');
            const noRes = document.getElementById('no-results');
            
            if (data.length === 0) {
                grid.innerHTML = '';
                noRes.classList.remove('hidden');
                return;
            }
            noRes.classList.add('hidden');

            grid.innerHTML = data.map(game => {
                const inCart = cart.some(item => item.id === game.id);
                return `
                <div class="bg-gray-900 p-3.5 rounded-2xl shadow-lg border border-gray-800 transition hover:border-blue-500 flex flex-col justify-between relative group">
                    <button onclick="deleteGame(${game.id})" title="حذف اللعبة" class="absolute top-2 left-2 z-10 bg-red-600/90 hover:bg-red-600 text-white text-xs px-2 py-1 rounded-lg font-bold transition cursor-pointer">
                        <i class="fa-solid fa-trash"></i> حذف
                    </button>

                    <div>
                        <div class="w-full h-52 bg-gray-950 rounded-xl mb-3 overflow-hidden flex items-center justify-center border border-gray-800/80">
                            <img src="${game.image}" alt="${game.name}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x400/1e293b/ffffff?text=PS4+Game';">
                        </div>
                        <h3 class="font-bold text-xs md:text-sm mb-3 text-white line-clamp-2 h-9 leading-tight">${game.name}</h3>
                    </div>
                    <button 
                        onclick="addToCart(${game.id})" 
                        ${inCart ? 'disabled' : ''}
                        class="w-full py-2 rounded-xl text-xs md:text-sm font-bold transition ${
                            inCart 
                            ? 'bg-gray-800 text-gray-500 cursor-not-allowed border border-gray-700' 
                            : 'bg-blue-600 hover:bg-blue-500 text-white cursor-pointer shadow-md shadow-blue-600/30'
                        }">
                        ${inCart ? 'مضافة بالسلة' : 'إضافة للسلة'}
                    </button>
                </div>
            `;
            }).join('');
        }

        function filterGames() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = games.filter(g => g.name.toLowerCase().includes(query));
            renderGames(filtered);
        }

        function toggleCart() { 
            document.getElementById('cart-modal').classList.toggle('hidden'); 
        }

        function addToCart(id) {
            const game = games.find(g => g.id === id);
            if (!cart.some(item => item.id === id)) {
                cart.push(game);
                updateCartUI();
                filterGames(); 
            }
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const items = document.getElementById('cart-items');
            items.innerHTML = cart.length > 0 ? cart.map((g) => `
                <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                    <span class="text-sm font-medium text-gray-200">${g.name}</span>
                    <button onclick="removeFromCart(${g.id})" class="text-red-400 hover:text-red-300 text-xs cursor-pointer px-2.5 py-1 bg-gray-800 rounded-lg border border-gray-700">حذف</button>
                </div>
            `).join('') : '<p class="text-gray-500 text-center py-10">السلة فارغة حالياً</p>';
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
            filterGames(); 
        }

        function sendToWhatsApp() {
            if(cart.length === 0) return alert('السلة فارغة!');
            const phone = "9647726541533"; 
            const message = "مرحباً متجر أبو يونس، أود طلب الألعاب حسب الصور التالية:\n\n" + cart.map((g, index) => `${index + 1}. ${g.image}`).join('\n\n');
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        renderGames();
    </script>
</body>
</html>
